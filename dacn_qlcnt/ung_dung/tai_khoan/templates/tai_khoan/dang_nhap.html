{% extends "base.html" %}
{% block noi_dung %}
  <div class="khung-xac-thuc">
    <h1>{{ tieu_de }}</h1>
    <form method="post" class="khoi-trang form-chinh">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for truong in form %}
        {% include "components/_o_nhap.html" %}
      {% endfor %}
      <button class="nut">{{ tieu_de }}</button>
    </form>
    <p><a href="{% url 'tai_khoan:dang_nhap' %}">Đăng nhập</a> · <a href="{% url 'tai_khoan:dang_ky' %}">Tạo tài khoản khách</a></p>
  </div>
{% endblock %}
