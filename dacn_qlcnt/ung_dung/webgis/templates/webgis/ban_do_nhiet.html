{% extends "base.html" %}
{% load static %}
{% block dau_trang %}
  <link rel="stylesheet" href="{% static 'vendor/leaflet/leaflet.css' %}">
{% endblock %}
{% block noi_dung %}
  <h1>Bản đồ nhiệt tồn khả dụng</h1>
  <form class="khoi-trang form-chinh" data-nhiet data-url="{% url 'webgis:du_lieu_nhiet' %}">
    <label>Nhóm ATC
    <select name="nhom_atc">
      {% for nhom in cac_nhom %}
        <option value="{{ nhom.pk }}">{{ nhom }}</option>
      {% endfor %}
    </select>
    </label>
    <label>Đơn vị cơ sở
    <select name="don_vi_tinh">
      {% for dv in cac_don_vi %}
        <option value="{{ dv.pk }}">{{ dv }}</option>
      {% endfor %}
    </select>
    </label>
    <button class="nut">Cập nhật bản đồ</button>
    <p data-trang-thai role="status"></p>
  </form>
  <div id="ban-do" class="ban-do">
  </div>
  <div data-so-lieu class="khoi-trang">
  </div>
{% endblock %}
{% block cuoi_trang %}
  <script src="{% static 'vendor/leaflet/leaflet.js' %}">
  </script>
  <script src="{% static 'vendor/leaflet_heat/leaflet-heat.js' %}">
  </script>
  <script src="{% static 'webgis/js/ban_do_nhiet.js' %}" defer>
  </script>
{% endblock %}
