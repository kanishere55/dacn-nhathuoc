{% extends "base.html" %}
{% block noi_dung %}
  <h1>Trò chuyện</h1>
  <section class="khoi-trang">
    <h2>Cuộc trò chuyện</h2>
    <ul class="space-y-3 mt-4">
      {% for phong in cac_phong %}
        <li><a class="duong-dan-noi-dung" href="{% url 'tro_chuyen:chi_tiet' phong.pk %}">{{ phong.chi_nhanh }} · {{ phong.khach_hang }}</a></li>
      {% empty %}<li>Chưa có cuộc trò chuyện.</li>{% endfor %}
    </ul>
  </section>
{% endblock %}
