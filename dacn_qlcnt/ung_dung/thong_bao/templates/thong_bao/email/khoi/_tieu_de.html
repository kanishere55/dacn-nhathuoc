{# Mở đầu thư tài khoản: câu chính (khác tiêu đề thư) và lời chào. Biến: tieu_de_lon, loi_chao. #}
<tr><td class="o" style="padding:28px 32px 0;font-family:Arial,Helvetica,sans-serif;">
<h1 class="chu" style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:30px;font-weight:bold;color:#184436;mso-line-height-rule:exactly;">{{ tieu_de_lon }}</h1>
{% if loi_chao %}<p class="chu chu-than" style="margin:12px 0 0;font-size:15px;line-height:24px;color:#25372f;">{{ loi_chao }}</p>{% endif %}
</td></tr>
