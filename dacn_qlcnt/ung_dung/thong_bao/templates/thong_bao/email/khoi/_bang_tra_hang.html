{# Các dòng thuốc khách trả. Biến: cac_dong_tra (ChiTietTraHang). #}
<tr><td class="o" style="padding:24px 32px 0;font-family:Arial,Helvetica,sans-serif;">
<h2 class="chu" style="margin:0 0 8px;font-size:16px;line-height:22px;font-weight:bold;color:#184436;">Thuốc trả lại</h2>
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
<thead><tr>
<th scope="col" align="left" class="chu-phu vach" style="padding:0 0 8px;border-bottom:1px solid #dce4dc;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;font-weight:normal;color:#5a6a61;">Thuốc</th>
<th scope="col" align="right" class="chu-phu vach" style="padding:0 0 8px;border-bottom:1px solid #dce4dc;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:18px;font-weight:normal;color:#5a6a61;">Số lượng</th>
</tr></thead>
<tbody>
{% for dong in cac_dong_tra %}
<tr>
<td class="chu vach" style="padding:10px 12px 10px 0;border-bottom:1px solid #edf1ed;font-size:15px;line-height:22px;color:#25372f;">{{ dong.chi_tiet_don_hang.thuoc.ten_thuoc }}</td>
<td align="right" class="chu vach" style="padding:10px 0;border-bottom:1px solid #edf1ed;font-size:15px;line-height:22px;color:#25372f;white-space:nowrap;">{{ dong.so_luong }} {{ dong.chi_tiet_don_hang.thuoc.don_vi_tinh.ten_don_vi_tinh|lower }}</td>
</tr>
{% endfor %}
</tbody>
</table>
</td></tr>
